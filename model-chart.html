<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ViSTR-Bench · Model Chart</title>
  <style>
    :root { color-scheme: light; --ink: #18202d; --muted: #697382; --line: #e2e6ec; --surface: #fff; --navy: #18267b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f6f8; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 14px; }
    button, input, select { font: inherit; }
    button, select, input[type="search"], input[type="text"] { border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); min-height: 38px; padding: 8px 11px; }
    button { cursor: pointer; }
    button:hover { background: #f3f5f8; }
    button:disabled { cursor: default; opacity: .45; }
    :focus-visible { outline: 3px solid #8caff0; outline-offset: 2px; }
    input[type="checkbox"] { accent-color: var(--navy); width: 16px; height: 16px; flex-shrink: 0; }
    header { padding: 22px 30px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    h1 { font-size: 20px; letter-spacing: -.5px; margin: 0 0 5px; }
    p { margin: 0; color: var(--muted); line-height: 1.6; }
    .brand { font-size: 12px; font-weight: 750; letter-spacing: 2px; color: var(--muted); white-space: nowrap; }
    main { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 22px; max-width: 1800px; margin: auto; padding: 24px; align-items: start; }
    aside, .workspace { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .sidebar-head { padding: 20px 18px 14px; border-bottom: 1px solid var(--line); }
    .sidebar-head strong { display: block; font-size: 15px; margin-bottom: 12px; }
    #search { width: 100%; }
    .quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .quick button { font-size: 12px; padding: 5px 9px; min-height: 30px; }
    #count { display: block; margin-top: 12px; color: var(--muted); font-size: 12px; }
    #models { max-height: 650px; overflow-y: auto; padding: 8px; }
    .model { display: flex; align-items: center; gap: 8px; padding: 9px 7px; border-radius: 6px; cursor: pointer; }
    .model:hover { background: #f5f6f9; }
    .model:has(input:checked) { background: #f1f4fc; }
    .model-name { min-width: 0; overflow-wrap: anywhere; font-size: 12px; line-height: 1.45; flex: 1; }
    .score { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
    .vendor-icon { display: inline-flex; width: 20px; height: 20px; align-items: center; justify-content: center; flex-shrink: 0; }
    .vendor-icon svg { display: block; }
    .sidebar-foot { border-top: 1px solid var(--line); padding: 14px 18px; font-size: 12px; }
    .sidebar-foot button { width: 100%; margin-top: 10px; }
    .controls { display: grid; grid-template-columns: repeat(4, minmax(110px, 1fr)); gap: 14px; padding: 20px; border-bottom: 1px solid var(--line); }
    .field { display: flex; flex-direction: column; gap: 7px; font-size: 12px; color: var(--muted); }
    .field select, .field input { width: 100%; }
    .title-field { grid-column: span 2; }
    .exports { display: flex; align-items: end; gap: 8px; grid-column: span 2; justify-content: flex-end; }
    .primary { background: var(--navy); color: #fff; border-color: var(--navy); }
    .primary:hover { background: #25378d; }
    #chart-scroll { overflow: auto; padding: 12px; background: #fff; }
    #chart svg { display: block; max-width: none; }
    .empty { padding: 100px 24px; text-align: center; color: var(--muted); }
    .chart-foot { border-top: 1px solid var(--line); padding: 12px 20px; display: flex; justify-content: space-between; gap: 20px; color: var(--muted); font-size: 12px; }
    details { padding: 16px 20px; border-top: 1px solid var(--line); }
    summary { cursor: pointer; color: var(--muted); font-size: 12px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 12px; }
    th, td { padding: 9px; border-bottom: 1px solid var(--line); text-align: left; }
    td:last-child, th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    #notice { padding: 0 24px 18px; max-width: 1800px; margin: auto; font-size: 12px; }
    [hidden] { display: none !important; }
    @media (max-width: 1000px) { main { grid-template-columns: 260px minmax(0, 1fr); gap: 14px; padding: 14px; } .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); } .exports { justify-content: flex-start; } }
    @media (max-width: 650px) { header { padding: 18px; } .brand { display: none; } main { grid-template-columns: 1fr; } #models { max-height: 260px; } .chart-foot { flex-direction: column; gap: 5px; } }
  </style>
</head>
<body>
  <header>
    <div><h1>模型结果图表</h1><p>选择模型，生成可导出的 ViSTR-Bench 排行图。</p></div>
    <span class="brand">ViSTR-Bench / CHART STUDIO</span>
  </header>
  <main>
    <aside aria-label="模型选择">
      <div class="sidebar-head">
        <strong>展示哪些模型</strong>
        <input id="search" type="search" placeholder="搜索模型名称…" aria-label="搜索模型">
        <div class="quick">
          <button type="button" data-top="6">前 6 名</button>
          <button type="button" data-top="12">前 12 名</button>
          <button type="button" data-top="20">前 20 名</button>
          <button type="button" id="select-all">全选</button>
          <button type="button" id="select-none">清空</button>
        </div>
        <span id="count" role="status" aria-live="polite"></span>
      </div>
      <div id="models"></div>
      <div class="sidebar-foot">
        <p>搜索仅筛选左侧列表。Human 可在 Overall 中单独勾选。未匹配品牌图标的研究模型显示项目缩写。</p>
        <button type="button" id="import">导入当前 Split 的 CSV</button>
        <input id="csv-file" type="file" accept=".csv,text/csv" hidden>
      </div>
    </aside>
    <section class="workspace" aria-label="图表设置与预览">
      <div class="controls">
        <label class="field">数据范围<select id="split"><option value="overall">Overall</option><option value="public">Public</option><option value="private">Private</option></select></label>
        <label class="field">评价指标<select id="metric"></select></label>
        <label class="field">图表布局<select id="layout"><option value="vertical">纵向柱状图</option><option value="horizontal">横向排行榜</option></select></label>
        <label class="field">配色<select id="palette"><option value="family">按模型系列配色</option><option value="navy">统一深蓝</option></select></label>
        <label class="field title-field">图表标题<input id="title" type="text" maxlength="100" value="ViSTR-Bench" placeholder="输入图表标题"></label>
        <div class="exports"><button type="button" id="export-svg">导出 SVG</button><button type="button" id="export-png" class="primary">导出 PNG · 2×</button></div>
      </div>
      <div id="chart-scroll"><div id="chart"></div></div>
      <div class="chart-foot"><span id="summary" role="status" aria-live="polite"></span><span>准确率 · 0–100% · 按得分降序排列</span></div>
      <details><summary>查看所选模型的具体分数</summary><table><thead><tr><th scope="col">模型</th><th scope="col">准确率 (%)</th></tr></thead><tbody id="values"></tbody></table></details>
    </section>
  </main>
  <p id="notice" role="status">内置仓库结果快照，可离线打开。更新数据时，可导入对应的 summary CSV；模型选择会在当前浏览器中保存。</p>

        [/^GeoThinker/i, "GeoThinker", "", "GT"], [/^Spacer/i, "Spacer", "", "SP"],

        [/^SpatialLadder/i, "SpatialLadder", "", "SL"], [/^VG-LLM/i, "VG-LLM", "", "VG"],
        [/^VST/i, "VST", "", "VS"], [/^Human$/i, "Human baseline", "human"]
      ];
      const found = patterns.find(([pattern]) => pattern.test(name));
      return found ? { name: found[1], icon: found[2], initials: found[3] } : { name, icon: "", initials: "?" };
    }
    function vendorIcon(name, x = 0, y = 0, size = 20) {
      const brand = provider(name);
      let source = vendorIcons[brand.icon];
      let label = brand.name;
      if (brand.icon === "human") {
        source = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#a58c5e" stroke-width="1.7"><circle cx="12" cy="7" r="3.5"/><path d="M4.5 21v-2a7.5 7.5 0 0 1 15 0v2"/></svg>';
      } else if (!source) {
        label = `${brand.name} — 项目缩写，暂无已核实的品牌图标`;
        source = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#eef1f5"/><text x="12" y="16" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#687382" text-anchor="middle">${esc(brand.initials)}</text></svg>`;
      }
      // Give each copy its own gradient/clip IDs, including inside exported SVGs.
      const prefix = `vendor-${++iconSequence}-`;
      source = source.replace(/\bid="([^"]+)"/g, (_, id) => `id="${prefix}${id}"`)
        .replace(/url\(#([^)]+)\)/g, (_, id) => `url(#${prefix}${id})`)
        .replace("<svg", `<svg role="img" aria-label="${esc(label)}" x="${x}" y="${y}" width="${size}" height="${size}"`);
      return source.replace(/(<svg[^>]*>)/, (_, opening) => `${opening}<title>${esc(label)}</title>`);
    }
    function family(name) {
      const patterns = [
        [/^GPT/i, "OpenAI", "#20252b"], [/^Claude/i, "Anthropic", "#c88064"],
        [/^Gemini/i, "Google", "#388c65"], [/^Seed/i, "Seed", "#568fc2"],
        [/^Qwen/i, "Qwen", "#7971bd"], [/^DeepSeek/i, "DeepSeek", "#3869d8"],
        [/^GLM/i, "GLM", "#3c80a9"], [/^MiMo/i, "MiMo", "#de8d37"],
        [/^Intern/i, "Intern", "#4e9190"], [/^GeoThinker/i, "GeoThinker", "#8b719e"],
        [/^LLaVA/i, "LLaVA", "#ab7750"], [/^Human$/i, "Human", "#a58c5e"]
      ];
      const match = patterns.find(([pattern]) => pattern.test(name));
      return match ? { name: match[1], color: match[2] } : { name: "Other models", color: "#738496" };
    }
    function accuracyDifference(a, b) {
      let delta = score(b) - score(a);
      if (ui.metric.value === "overall_accuracy" && a.evaluated > 0 && b.evaluated > 0 && Number.isFinite(a.correct) && Number.isFinite(b.correct)) {
        delta = b.correct * a.evaluated - a.correct * b.evaluated;
      }
      return delta;
    }
    function compare(a, b) { return accuracyDifference(a, b) || a.name.localeCompare(b.name, undefined, { numeric: true }); }
    function rows() { return data[ui.split.value].filter((row) => Number.isFinite(score(row))).slice().sort(compare); }
    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ selected: [...selected], split: ui.split.value, metric: ui.metric.value, layout: ui.layout.value, palette: ui.palette.value, title: ui.title.value })); } catch (_) {}
    }
    function selectTop(n) {
      selected = new Set(rows().filter((row) => !row.human).slice(0, n).map((row) => row.name));
      render();
    }
    function renderList() {
      const query = ui.search.value.trim().toLocaleLowerCase();
      const visible = rows().filter((row) => row.name.toLocaleLowerCase().includes(query));
      ui.models.innerHTML = visible.length ? visible.map((row) => `<label class="model"><input type="checkbox" value="${esc(row.name)}" ${selected.has(row.name) ? "checked" : ""}><span class="vendor-icon" aria-hidden="true">${vendorIcon(row.name)}</span><span class="model-name">${esc(row.name)}</span><span class="score">${score(row).toFixed(1)}</span></label>`).join("") : '<p style="padding:16px">没有匹配的模型</p>';
      const available = rows();
      const count = available.filter((row) => selected.has(row.name)).length;
      ui.count.textContent = `已选 ${count} / ${available.length} 项 · 列表分数为 ${metricLabel()}`;
    }
    function svgText(x, y, text, attrs = "") { return `<text x="${x}" y="${y}" ${attrs}>${esc(text)}</text>`; }
    function createChart(chosen) {
      const vertical = ui.layout.value === "vertical";
      const longest = Math.max(...chosen.map((row) => row.name.length));
      const left = vertical ? Math.max(70, Math.ceil(longest * 7.3 * .58) + 20) : Math.max(360, longest * 8 + 140);
      const width = vertical ? Math.max(1120, left + 84 + chosen.length * 78) : Math.max(1180, left + 720);
      const right = 84;
      const plotWidth = width - left - right;
      const top = 130;
      const plotHeight = vertical ? 370 : chosen.length * 56;
      const labelRoom = vertical ? Math.ceil(longest * 7.3 * .82) + 62 : 40;
      const height = top + plotHeight + labelRoom + 20;
      const bottom = top + plotHeight;
      const parts = [`<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-labelledby="chart-title chart-desc">`,
        `<title id="chart-title">${esc(ui.title.value || "ViSTR-Bench")} — ${esc(metricLabel())}</title>`,
        `<desc id="chart-desc">${esc(SPLITS[ui.split.value])}, accuracy from 0 to 100 percent. ${esc(chosen.map((row) => `${row.name}: ${score(row).toFixed(1)}%`).join("; "))}</desc>`,
        `<rect width="${width}" height="${height}" fill="#ffffff"/>`,
        '<g font-family="Arial, Helvetica, sans-serif" fill="#18202d">',
        svgText(40, 56, ui.title.value || "ViSTR-Bench", 'font-family="Georgia, serif" font-size="34"'),
        svgText(41, 87, `${SPLITS[ui.split.value]} · ${metricLabel()} · Accuracy (%)`, 'font-size="16" fill="#687382"')];
      for (let tick = 0; tick <= 100; tick += 20) {
        if (vertical) {
          const y = bottom - tick / 100 * plotHeight;
          parts.push(`<line x1="${left}" y1="${y}" x2="${width - right}" y2="${y}" stroke="#e1e5eb" stroke-dasharray="3 5"/>`, svgText(left - 14, y + 5, tick, 'font-size="13" fill="#7b8491" text-anchor="end"'));
        } else {
          const x = left + tick / 100 * plotWidth;
          parts.push(`<line x1="${x}" y1="${top}" x2="${x}" y2="${bottom}" stroke="#e7e9ee"/>`, svgText(x, bottom + 28, tick, 'font-size="13" fill="#7b8491" text-anchor="middle"'));
        }
      }
      let modelRank = 0, previousModel = null, previousRank = 0;
      chosen.forEach((row, i) => {
        let rank = "—";
        if (!row.human) {
          modelRank++;
          rank = previousModel && accuracyDifference(row, previousModel) === 0 ? previousRank : modelRank;
          previousRank = rank;
          previousModel = row;
        }
        const color = row.human ? "#a58c5e" : ui.palette.value === "navy" ? "#18267b" : family(row.name).color;
        const value = score(row), label = value.toFixed(1);
        parts.push(`<g><title>${esc(row.name)}: ${label}%${row.human ? " (human baseline)" : ""}</title>`);
        if (vertical) {
          const step = plotWidth / chosen.length, barWidth = Math.min(56, step * .72);
          const x = left + i * step + (step - barWidth) / 2, h = value / 100 * plotHeight, y = bottom - h;
          parts.push(`<rect x="${x}" y="${y}" width="${barWidth}" height="${h}" rx="4" fill="${color}"/>`, svgText(x + barWidth / 2, y - 11, label, 'font-size="16" font-weight="700" text-anchor="middle"'),
            vendorIcon(row.name, x + barWidth / 2 - 10, bottom + 12, 20),
            `<text transform="translate(${x + barWidth / 2 + 4} ${bottom + 53}) rotate(-55)" text-anchor="end" font-size="14">${esc(row.name)}</text>`);
        } else {
          const y = top + i * 56, barWidth = value / 100 * plotWidth;
          parts.push(`<circle cx="58" cy="${y + 22}" r="14" fill="#fff" stroke="#d7dce4"/>`, svgText(58, y + 27, rank, 'font-size="12" text-anchor="middle" fill="#697382"'),
            svgText(88, y + 28, row.name, 'font-size="16"'), vendorIcon(row.name, left - 36, y + 10, 24),
            `<rect x="${left}" y="${y + 3}" width="${barWidth}" height="38" rx="3" fill="${color}"/>`,
            svgText(left + barWidth + 13, y + 28, label, 'font-size="16" font-weight="700"'));
        }
        parts.push("</g>");
      });
      parts.push("</g></svg>");
      currentSize = [width, height];
      return parts.join("");
    }
    function renderChart() {
      currentRows = rows().filter((row) => selected.has(row.name));
      ui.summary.textContent = `${SPLITS[ui.split.value]} · ${metricLabel()} · 展示 ${currentRows.length} 项`;
      ui["export-svg"].disabled = currentRows.length === 0;
      ui["export-png"].disabled = currentRows.length === 0 || exportBusy;
      ui.values.innerHTML = currentRows.map((row) => `<tr><td>${esc(row.name)}</td><td>${score(row).toFixed(1)}</td></tr>`).join("");
      currentSvg = currentRows.length ? createChart(currentRows) : "";
      ui.chart.innerHTML = currentSvg || '<div class="empty">请在左侧勾选要展示的模型。</div>';
      const svg = ui.chart.querySelector("svg");
      if (svg) {
        const naturalWidth = currentSize[0];
        const available = Math.max(0, $("chart-scroll").clientWidth - 24);
        const minWidth = ui.layout.value === "vertical" ? Math.max(760, currentRows.length * 55) : 900;
        svg.style.width = `${Math.max(minWidth, Math.min(naturalWidth, available || naturalWidth))}px`;
        svg.style.height = "auto";
      }
    }
    function render() { renderList(); renderChart(); save(); }
    function download(blob, extension) {
      const url = URL.createObjectURL(blob), link = document.createElement("a");
      link.href = url;
      link.download = `vistr-bench-${ui.split.value}-${ui.metric.value}-${ui.layout.value}.${extension}`;
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    ui.metric.innerHTML = METRICS.map(([key, label]) => `<option value="${key}">${label}</option>`).join("");
    let restored = false;
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved && Array.isArray(saved.selected)) {
        for (const key of ["split", "metric", "layout", "palette"]) {
          if ([...ui[key].options].some((option) => option.value === saved[key])) ui[key].value = saved[key];
        }
        if (typeof saved.title === "string") ui.title.value = saved.title.slice(0, 100);
        selected = new Set(saved.selected.filter((name) => typeof name === "string")); restored = true;
      }
    } catch (_) {}
    if (!restored) selected = new Set(rows().filter((row) => !row.human).slice(0, 12).map((row) => row.name));
    ui.models.addEventListener("change", (event) => {
      if (event.target.type !== "checkbox") return;
      if (event.target.checked) selected.add(event.target.value); else selected.delete(event.target.value);
      render();
    });
    ui.search.addEventListener("input", renderList);
    for (const id of ["split", "metric", "layout", "palette"]) ui[id].addEventListener("change", render);
    ui.title.addEventListener("input", () => { renderChart(); save(); });
    document.querySelectorAll("[data-top]").forEach((button) => button.addEventListener("click", () => selectTop(Number(button.dataset.top))));
    $("select-all").addEventListener("click", () => { selected = new Set(rows().map((row) => row.name)); render(); });
    $("select-none").addEventListener("click", () => { selected.clear(); render(); });
    ui["export-svg"].addEventListener("click", () => { if (currentSvg) download(new Blob([currentSvg], { type: "image/svg+xml;charset=utf-8" }), "svg"); });
    ui["export-png"].addEventListener("click", async () => {
      if (!currentSvg || exportBusy) return;
      exportBusy = true; ui["export-png"].disabled = true;
      const svg = currentSvg, [width, height] = currentSize;
      const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml;charset=utf-8" }));
      try {
        const image = new Image();
        await new Promise((resolve, reject) => { image.onload = resolve; image.onerror = reject; image.src = url; });
        const canvas = document.createElement("canvas");
        canvas.width = width * 2; canvas.height = height * 2;
        const ctx = canvas.getContext("2d");
        if (!ctx) throw new Error("Canvas unavailable");
        ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
        if (!blob) throw new Error("PNG export failed");
        download(blob, "png");
        ui.notice.textContent = "PNG 已导出（2× 分辨率）；也可导出 SVG 用于无损缩放。";
      } catch (_) { ui.notice.textContent = "PNG 导出失败，请尝试导出 SVG 或减少展示的模型数量。"; }
      finally { URL.revokeObjectURL(url); exportBusy = false; ui["export-png"].disabled = currentRows.length === 0; }
    });
    function parseCsv(text) {
      const records = []; let row = [], cell = "", quoted = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (quoted) {
          if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
          else if (c === '"') quoted = false; else cell += c;
        } else if (c === '"') quoted = true;
        else if (c === ",") { row.push(cell); cell = ""; }
        else if (c === "\n") { row.push(cell); if (row.some((v) => v.trim())) records.push(row); row = []; cell = ""; }
        else if (c !== "\r") cell += c;
      }
      if (quoted) throw new Error("CSV 引号未闭合");
      if (cell || row.length) { row.push(cell); records.push(row); }
      const headers = (records.shift() || []).map((value) => value.trim().replace(/^\uFEFF/, ""));
      if (!headers.includes("model") || !headers.includes("overall_accuracy")) throw new Error("请使用包含 model 和 overall_accuracy 列的 summary CSV");
      const numeric = (value) => { const cleaned = String(value ?? "").trim().replace(/%$/, ""); return cleaned === "" ? null : Number(cleaned); };
      const result = records.map((cells) => {
        const record = Object.fromEntries(headers.map((key, i) => [key, (cells[i] || "").trim()]));
        return { name: record.model, human: /^human$/i.test(record.model) || /^human$/i.test(record.model_id) || record.source_kind === "human_evaluation", correct: numeric(record.correct), evaluated: numeric(record.evaluated_questions), scores: Object.fromEntries(METRICS.map(([key]) => [key, numeric(record[key])])) };
      });
      if (!result.length || result.some((row) => !row.name || !Number.isFinite(row.scores.overall_accuracy))) throw new Error("CSV 存在空模型名称或无效的 Average 分数");
      if (result.some((row) => Object.values(row.scores).some((value) => value !== null && (!Number.isFinite(value) || value < 0 || value > 100)))) throw new Error("准确率必须在 0 到 100 之间");
      if (new Set(result.map((row) => row.name)).size !== result.length) throw new Error("CSV 存在重复模型名称，请先合并重复记录");
      return result;
    }
    $("import").addEventListener("click", () => $("csv-file").click());
    $("csv-file").addEventListener("change", async (event) => {
      const file = event.target.files[0]; if (!file) return;
      const split = ui.split.value;
      try {
        const imported = parseCsv(await file.text()); data[split] = imported;
        if (ui.split.value === split) render();
        ui.notice.textContent = `已更新 ${SPLITS[split]} 数据：${file.name}（${imported.length} 项）。导入的数据仅用于当前页面，重新打开后恢复内置快照。`;
      } catch (error) { ui.notice.textContent = `导入失败：${error.message}`; }
      event.target.value = "";
    });
    window.addEventListener("resize", renderChart);
    render();
  })();
  </script>
</body>
</html>
